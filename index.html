<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Northstar</title>
<!-- Hero photo: "Coast near Great Skorbeevsky Cape", Rybachy Peninsula, Murmansk Oblast, Russia.
     Photo by SnapSaga on Unsplash — free to use under the Unsplash License. -->
<style>
  :root{
    --bg: #05100a;
    --bg-2: #0b1810;
    --line: #1e3324;
    --ink: #eef3ec;
    --ink-dim: #92a696;
    --green: #2f6b45;
    --green-bright: #57c278;
    --green-glow: rgba(87,194,120,0.45);
  }

  *{ box-sizing: border-box; }

  html{ background: #05100a; }

  body{
    margin:0;
    background: var(--bg);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--ink);
    animation: pageFadeIn 0.7s ease both;
  }

  @keyframes pageFadeIn{
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    body{ animation: none; }
  }

  .hero{
    position: relative;
    min-height: 440px;
    background-image:
      linear-gradient(180deg, rgba(5,16,10,0.75) 0%, rgba(5,16,10,0.25) 210px, rgba(5,16,10,0.15) 380px, var(--bg) 100%),
      linear-gradient(120deg, rgba(20,60,35,0.35), rgba(5,16,10,0.1)),
      url('https://images.unsplash.com/photo-1693417793767-6ca227cbc6f1?auto=format&fit=crop&w=2000&q=80');
    background-size: cover, cover, cover;
    background-position: center, center, center;
    background-repeat: no-repeat, no-repeat, no-repeat;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 40px 32px 56px;
  }

  .navax-header{
    display:flex;
    justify-content: space-between;
    align-items:center;
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
    gap: 20px;
    flex-wrap: wrap;
    position: relative;
    z-index: 2;
  }

  .navax-logo{
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 700;
    font-size: 1.3rem;
    letter-spacing: 0.06em;
    text-shadow: 0 2px 10px rgba(0,0,0,0.6);
  }
  .navax-logo .star{ color: var(--green-bright); margin-right: 8px; }

  /* ---- smooth rounded tab nav, top right ---- */
  .tab-nav{
    display:flex;
    align-items:center;
    gap: 8px;
  }

  .tab-btn{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family: 'Arial Narrow', Arial, sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--ink-dim);
    background: linear-gradient(180deg, rgba(10,22,15,0.9), rgba(5,14,9,0.85));
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    padding: 11px 22px;
    transition: color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    backdrop-filter: blur(2px);
  }

  .tab-btn .tick{
    font-size: 0.68rem;
    color: var(--green-bright);
    margin-right: 8px;
    font-weight: 700;
    opacity: 0.9;
  }

  .tab-btn:hover{
    color: var(--ink);
    border-color: rgba(87,194,120,0.5);
    transform: translateY(-1px);
  }

  .tab-btn.is-active{
    color: #06120b;
    background: linear-gradient(180deg, var(--green-bright), var(--green));
    border-color: transparent;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.25) inset,
      0 8px 20px -8px var(--green-glow);
  }

  .tab-btn.is-active:hover{ transform: none; }

  .tab-btn.is-active .tick{ color: rgba(6,18,11,0.6); }

  .hero-copy{
    position: relative;
    z-index: 2;
    max-width: 1100px;
    margin: 0 auto;
    width: 100%;
  }

  .hero-kicker{
    color: var(--green-bright);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 10px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }

  .hero-copy h1{
    font-family: Georgia, serif;
    font-size: 2.4rem;
    margin: 0 0 8px;
    text-shadow: 0 2px 14px rgba(0,0,0,0.55);
    max-width: 20ch;
  }

  .hero-copy p{
    color: rgba(238,243,236,0.82);
    max-width: 46ch;
    line-height: 1.5;
    margin:0;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }

  .panel-wrap{ padding: 48px 32px; }

  .panel{
    max-width: 1100px;
    margin: 0 auto;
    min-height: 260px;
    border: 1px solid var(--line);
    border-left: 3px solid var(--green-bright);
    border-radius: 6px;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent 40%), var(--bg-2);
    padding: 44px 48px;
  }

  .panel h2{
    font-family: Georgia, serif;
    font-size: 1.7rem;
    margin: 0 0 12px;
  }

  .panel p{
    color: var(--ink-dim);
    line-height: 1.6;
    max-width: 60ch;
    margin: 0;
  }

  .panel p strong{
    color: var(--green-bright);
    font-weight: 700;
  }

  .panel p a{
    color: var(--green-bright);
    font-weight: 700;
    text-decoration: none;
    border-bottom: 1px solid rgba(87,194,120,0.4);
  }
  .panel p a:hover{ border-bottom-color: var(--green-bright); }

  /* ---- stat row: reflects the 4-faction / currency mechanic, About tab only ---- */
  .stat-row{
    display:flex;
    gap: 36px;
    margin-top: 28px;
    flex-wrap: wrap;
  }

  .stat{ min-width: 92px; }

  .faction-ticks{
    display:flex;
    gap: 4px;
    margin-bottom: 8px;
  }

  .faction-ticks span{
    width: 16px;
    height: 5px;
    border-radius: 3px;
    background: var(--green-bright);
    opacity: 0.85;
  }

  .stat-value{
    font-family: Georgia, serif;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--ink);
    line-height: 1;
  }

  .stat-label{
    font-size: 0.72rem;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 4px;
  }

  @media (max-width: 640px){
    .navax-header{ justify-content:center; text-align:center; }
    .hero{ min-height: 480px; padding: 32px 20px 40px; }
    .hero-copy{ text-align:center; }
    .hero-copy h1{ max-width: none; font-size: 1.9rem; }
    .hero-copy p{ max-width: none; margin: 0 auto; }
    .tab-btn{ padding:10px 16px; }
    .panel{ padding: 32px 24px; }
    .stat-row{ justify-content:center; gap:28px; }
  }
</style>
</head>
<body>

  <div class="hero">
    <div class="navax-header">
      <div class="navax-logo"><span class="star">✦</span>NORTHSTAR</div>

      <nav class="tab-nav" role="tablist" aria-label="Site sections">
        <button class="tab-btn is-active" role="tab" aria-selected="true" data-tab="about">
          <span class="tick">01</span>About
        </button>
        <button class="tab-btn" role="tab" aria-selected="false" data-tab="funding">
          <span class="tick">02</span>Funding
        </button>
        <button class="tab-btn" role="tab" aria-selected="false" data-tab="updates">
          <span class="tick">03</span>Updates
        </button>
      </nav>
    </div>

    <div class="hero-copy">
      <div class="hero-kicker">Four factions, one treasury</div>
      <h1>Northstar</h1>
      <p>An immersive Roblox PvP game where four rival factions battle for control — currently in development.</p>
    </div>
  </div>

  <div class="panel-wrap">
    <div class="panel" id="panel">
      <h2 id="panel-title"></h2>
      <p id="panel-body"></p>
      <div class="stat-row" id="panel-stats">
        <div class="stat">
          <div class="faction-ticks"><span></span><span></span><span></span><span></span></div>
          <div class="stat-value">4</div>
          <div class="stat-label">Factions</div>
        </div>
        <div class="stat">
          <div class="stat-value">$1M</div>
          <div class="stat-label">Starting treasury</div>
        </div>
        <div class="stat">
          <div class="stat-value">5mo</div>
          <div class="stat-label">Cycle length</div>
        </div>
      </div>
    </div>
  </div>

<script>
  const tabs = document.querySelectorAll('.tab-btn');
  const title = document.getElementById('panel-title');
  const body = document.getElementById('panel-body');
  const stats = document.getElementById('panel-stats');

  // Single source of truth: every tab's text lives here, and ONLY here.
  // The HTML above starts with empty <h2>/<p> tags on purpose — this script
  // fills them in on load AND on every click, from this same object. Edit
  // text here and it'll be correct everywhere, including switching back to
  // a tab you already visited.
  //
  // These are double-quoted strings, so normal apostrophes (it's, don't) are
  // safe to type. Just don't put a literal " character inside one — that's
  // the only thing that breaks it.
  const content = {
    about: {
      title: "About",
      body: "Northstar drops four rival factions into one shared economy. Whichever faction is holding the most money when the cycle turns takes a major advantage over the rest.",
      showStats: true
    },
    funding: {
      title: "Funding",
      body: "Support the project by helping fund development, assets, and future updates. DM <strong>Flexiboon</strong> on Discord to contribute — you may receive exclusive in-game perks as a thank-you.",
      showStats: false
    },
    updates: {
      title: "Updates",
      body: "Use this invite link to see updates on development: <a href=\"https://discord.gg/9MdMvchxhG\" target=\"_blank\" rel=\"noopener noreferrer\">https://discord.gg/9MdMvchxhG</a>",
      showStats: false
    }
  };

  function showTab(key){
    const data = content[key];
    title.textContent = data.title;
    body.innerHTML = data.body;
    stats.style.display = data.showStats ? 'flex' : 'none';
  }

  tabs.forEach(btn => {
    btn.addEventListener('click', () => {
      tabs.forEach(b => { b.classList.remove('is-active'); b.setAttribute('aria-selected','false'); });
      btn.classList.add('is-active');
      btn.setAttribute('aria-selected','true');
      showTab(btn.dataset.tab);
    });
  });

  // populate the default (About) tab from the same source of truth on load
  showTab('about');
</script>

</body>
</html>
